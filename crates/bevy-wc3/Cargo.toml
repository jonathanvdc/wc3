[package]
name = "bevy-wc3"
version.workspace = true
edition = "2021"
rust-version = "1.95"
description = "Bevy renderer for Warcraft III models"
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/bevy-wc3"
repository = "https://github.com/jonathanvdc/wc3"
keywords = ["warcraft", "bevy", "mdx", "mdl", "renderer"]
categories = ["game-development", "rendering"]

[dependencies]
bevy = { version = "0.19.1", features = ["dds", "png", "tga"] }
wc3 = { workspace = true, features = ["blp-decode"] }
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
bevy-mpq = { workspace = true }
naga = { version = "29", features = ["wgsl-in"] }
