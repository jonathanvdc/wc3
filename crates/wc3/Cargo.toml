[package]
name = "wc3"
version.workspace = true
edition = "2021"
rust-version = "1.97"
description = "Read, edit, and write Warcraft III and WoW models, BLP textures, and MPQ archives"
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/wc3"
repository = "https://github.com/jonathanvdc/wc3"
keywords = ["warcraft", "mdx", "mdl", "model", "binary"]
categories = ["parser-implementations", "game-development"]

[dependencies]
glam = { version = "0.32.1", default-features = false, features = ["std"] }
zerovec = { version = "0.11.8", features = ["alloc", "derive"] }
md5 = "0.8"
bitfield = "0.19"
image = { version = "0.25.10", default-features = false, optional = true }
zune-jpeg = { version = "0.5.15", default-features = false, optional = true }
color_quant = { version = "1.1", optional = true }
jpeg-encoder = { version = "0.7.1", optional = true }
squish = { version = "1.0.0", optional = true }
wc3-derive = { workspace = true }
flate2 = { version = "1.1", default-features = false, features = ["miniz_oxide"], optional = true }
bzip2 = { version = "0.6", optional = true }
explode = { version = "0.1.2", optional = true }
lzma-rs = { version = "0.3", optional = true }

[target.'cfg(all(any(unix, windows), any(target_arch = "x86_64", target_arch = "aarch64", target_arch = "riscv64", target_arch = "s390x")))'.dependencies]
cranelift-codegen = { version = "0.137.0", default-features = false, features = ["std", "host-arch"], optional = true }
cranelift-frontend = { version = "0.137.0", optional = true }
cranelift-jit = { version = "0.137.0", optional = true }
cranelift-module = { version = "0.137.0", optional = true }

[features]
default = []
popcorn-jit = ["dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-jit", "dep:cranelift-module"]
blp-decode = ["dep:image", "dep:zune-jpeg"]
blp-encode = ["dep:image", "dep:color_quant", "dep:jpeg-encoder", "dep:squish"]
mpq-decode = ["dep:flate2", "dep:bzip2", "dep:explode", "dep:lzma-rs"]
mpq-encode = ["dep:flate2", "dep:bzip2"]

[dev-dependencies]
criterion = { workspace = true }
clap = { version = "4", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }

[[example]]
name = "blp_to_png"
required-features = ["blp-decode"]

[[example]]
name = "mpq_concurrent"
required-features = ["mpq-decode", "mpq-encode"]

[[bench]]
name = "model"
harness = false

[[bench]]
name = "animation"
harness = false

[[bench]]
name = "blp"
harness = false
required-features = ["blp-decode", "blp-encode"]

[[bench]]
name = "mpq"
harness = false
required-features = ["mpq-decode", "mpq-encode"]

[[example]]
name = "benchmark_fixtures"
required-features = ["blp-encode"]


[[bench]]
name = "evaluation"
harness = false

[[bench]]
name = "packed_storage"
harness = false

[[bench]]
name = "particle_runtime"
harness = false
