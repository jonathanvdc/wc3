[package]
name = "wc3-derive"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "Binary MDX and streaming MDL codec derives for wc3"
repository = "https://github.com/jonathanvdc/wc3"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
bitfield = "0.19"
wc3 = { path = "../wc3" }
