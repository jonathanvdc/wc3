[package]
name = "bevy-mpq"
version.workspace = true
edition = "2021"
rust-version = "1.95"
description = "Caller-configured MPQ asset sources for Bevy"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/jonathanvdc/wc3"

[dependencies]
bevy_asset = "0.19.1"
blocking = "1"
async-lock = "3"
wc3 = { workspace = true, features = ["mpq-decode"] }

[dev-dependencies]
wc3 = { workspace = true, features = ["mpq-encode"] }
futures-lite = "2"
