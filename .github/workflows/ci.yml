name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Full debug information makes the Bevy test binaries exceed runner disk space.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libasound2-dev libudev-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked
      - name: Quick optimized benchmarks
        run: bash benchmarks/run-quick.sh
      - name: Upload Criterion results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: criterion-results
          path: target/criterion/quick
          if-no-files-found: ignore
          retention-days: 14
      - name: Report build disk usage
        if: always()
        run: |
          df -h .
          if [ -d target ]; then du -sh target; fi
